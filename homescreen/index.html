<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>St. Peter Seal of the Martyrs</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="config.js"></script>
<script src="room.js" onerror="void 0"></script>
<script src="version.js" onerror="void 0"></script>

<style>
  /* St. Peter OS, in the colors and type of stpeterwpb.org.
     Kept deliberately simple: a few big buttons, one line of date, nothing else unless it's needed. */
  :root{
    --red:#5C0F1A; --red-deep:#3D0A12; --red-soft:#6E1A26;
    --gold:#C49838; --gold-dim:#C4983866;
    --parchment:#F5F0E6; --parchment-dim:#D9CDB8; --ink:#1A1410;
    --display:"Cinzel",Georgia,serif; --serif:"EB Garamond",Georgia,serif;
    --ar:"Amiri","EB Garamond",serif; --ar-ui:"EB Garamond","IBM Plex Sans Arabic",sans-serif;
  }
  html{font-size:calc(100vw / 120)}           /* 16px on a 1920-wide TV */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:linear-gradient(180deg,var(--red) 0%,var(--red-deep) 100%);color:var(--parchment);
    font:1.5rem/1.4 var(--serif);overflow:hidden;user-select:none;cursor:default;font-variant-numeric:lining-nums}
  html[lang=ar] body{font-family:var(--ar-ui)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus{outline:none}
  svg{display:block}
  img.mark{object-fit:contain}

  /* ---------- home ---------- */
  #home{position:absolute;inset:0;padding:4rem 6rem 3rem;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:1.8rem}
  .mark{width:6rem;height:6rem;color:var(--gold);flex:none}
  .church{font:600 2.3rem/1.2 var(--display);letter-spacing:.02em}
  html[lang=ar] .church{font:700 2.4rem/1.4 var(--ar)}
  .today{color:var(--parchment-dim);font-size:1.5rem;margin-top:.2rem}
  .today b{color:var(--gold);font-weight:500}
  .clock{margin-inline-start:auto;font:600 3.4rem/1 var(--display);font-variant-numeric:lining-nums tabular-nums}
  html[lang=ar] .clock{font-family:var(--ar)}

  .tiles{flex:1;display:flex;align-items:center;justify-content:center;gap:2.4rem}
  .tile{width:20rem;height:20rem;border-radius:1.6rem;background:var(--red-soft);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1.6rem;transition:background .15s,color .15s,transform .15s,box-shadow .15s}
  .tile svg{width:6rem;height:6rem;color:var(--gold)}
  /* five or six buttons still fit on one row */
  .tiles[data-n="5"]{gap:2rem} .tiles[data-n="5"] .tile{width:18.4rem;height:18.4rem}
  .tiles[data-n="6"]{gap:1.6rem} .tiles[data-n="6"] .tile{width:15.8rem;height:15.8rem}
  .tiles[data-n="6"] .tile svg{width:5rem;height:5rem} .tiles[data-n="6"] .tile b{font-size:1.6rem}
  .tile b{font:600 1.9rem/1.2 var(--display);letter-spacing:.02em;text-align:center;padding:0 1rem}
  html[lang=ar] .tile b{font:700 2.1rem/1.3 var(--ar)}
  .tiles.many{gap:2rem} .tiles.many .tile{width:17.5rem;height:18.5rem} .tiles.many .tile b{font-size:1.7rem}
  .tile:focus,.tile:hover{background:var(--parchment);color:var(--ink);transform:scale(1.06);box-shadow:0 0 0 .35rem var(--gold),0 1.5rem 3rem #0006}
  .tile:focus svg,.tile:hover svg{color:var(--red)}

  footer{display:flex;align-items:center;justify-content:space-between}
  .pill.wifi{display:flex;align-items:center;gap:.7rem}
  .pill.wifi svg{width:1.6rem;height:1.6rem}
  .pill.wifi.off{border-color:var(--gold);color:var(--gold)}
  .pill.wifi.off:focus,.pill.wifi.off:hover{color:var(--ink)}
  .pill{padding:.6rem 1.4rem;border-radius:999rem;border:1.5px solid var(--gold-dim);color:var(--parchment);font-size:1.35rem;
    transition:background .15s,color .15s}
  .pill:focus,.pill:hover{background:var(--parchment);color:var(--ink);border-color:var(--parchment)}
  .pill.ar{font-family:var(--ar-ui)}

  /* ---------- start screens ---------- */
  .stage{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.6rem;
    background:linear-gradient(180deg,var(--red) 0%,var(--red-deep) 100%);text-align:center}
  .stage.show{display:flex}
  .stage .mark{width:10rem;height:10rem}
  .stage .church{font-size:2.2rem}
  .stage h1{font:600 3.6rem/1.2 var(--display)}
  html[lang=ar] .stage h1{font:700 3.8rem/1.4 var(--ar)}
  .choices{display:flex;gap:3rem;margin-top:1rem}
  .choice{width:28rem;height:16rem;border-radius:1.6rem;background:var(--red-soft);font:600 3.6rem var(--display);
    transition:background .15s,color .15s,transform .15s,box-shadow .15s}
  .choice.arb{font:700 4rem var(--ar)}
  .choice:focus,.choice:hover{background:var(--parchment);color:var(--ink);transform:scale(1.04);box-shadow:0 0 0 .35rem var(--gold)}
  .pickhead{font:600 2.8rem/1.4 var(--display)}
  .pickhead span{display:block;font:700 2.8rem/1.4 var(--ar)}

  .stage .clock{position:absolute;inset-inline-end:4rem;top:3.4rem;font-size:2.6rem}

  /* ---------- pop-ups ---------- */
  .overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#1F060Ad9}
  .overlay.show{display:flex}
  .sheet{background:var(--parchment);color:var(--ink);width:60rem;max-width:90vw;padding:3.6rem 4rem 3rem;border-radius:1.6rem;
    text-align:center;display:flex;flex-direction:column;gap:1.4rem;box-shadow:0 2rem 5rem #0008}
  .sheet h2{font:600 2.6rem/1.2 var(--display);color:var(--red)}
  html[lang=ar] .sheet h2{font:700 2.8rem/1.4 var(--ar)}
  .sheet p{font-size:1.7rem;color:#3A3026;line-height:1.45}
  .sheet ol{text-align:start;font-size:1.75rem;line-height:1.6;margin:0 auto;padding-inline-start:2.4rem;max-width:46rem}
  .sheet .name{color:var(--red);font-weight:600}
  .sheet .row{display:flex;gap:1rem;justify-content:center;margin-top:.8rem}
  .sheet .btn{min-width:15rem}
  .sheet .btn:focus,.sheet .btn:hover{box-shadow:0 0 0 .3rem var(--red)}
  .sheet .btn.ghost{color:var(--ink);border-color:#1A141055}
  .sheet .small{font-size:1.35rem;color:#7D5C1E}
  .sheet .warn{color:var(--red);font-size:1.5rem;min-height:2rem}
  [hidden]{display:none!important}
  .media{display:flex;flex-direction:column;gap:.8rem;margin:.4rem 0}
  .medium{display:flex;align-items:center;gap:1.4rem;padding:1.1rem 1.6rem;border-radius:1.2rem;background:#E9E0CF;text-align:start;font-size:1.6rem}
  .medium.on,.medium:focus,.medium:hover{background:var(--red);color:var(--parchment)}
  .medium svg{width:3.2rem;height:3.2rem;flex:none}
  .medium span{display:block;font-size:1.3rem;opacity:.8}
  .wait{display:flex;align-items:center;justify-content:center;gap:1rem;color:#7D5C1E;font-size:1.5rem}
  .wait::before{content:"";width:1.8rem;height:1.8rem;border-radius:50%;border:.25rem solid #5C0F1A33;border-top-color:var(--red);animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .progress{height:1.2rem;border-radius:1rem;background:#E9E0CF;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#A0283A);border-radius:1rem;transition:width .6s}

  /* ---------- Wi-Fi ---------- */
  .nets{display:flex;flex-direction:column;gap:.5rem;max-height:46vh;overflow:hidden auto;padding:.4rem;text-align:start}
  .net{display:flex;align-items:center;gap:1.2rem;padding:.9rem 1.4rem;border-radius:1rem;background:#E9E0CF;font-size:1.7rem}
  .net:focus,.net:hover{background:var(--red);color:var(--parchment)}
  .net .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .net .tag{font-size:1.3rem;opacity:.75}
  .net svg{width:1.8rem;height:1.8rem;flex:none}
  .pw{display:flex;gap:1rem;justify-content:center;align-items:center}
  .pw input{font:inherit;font-size:1.9rem;width:32rem;padding:.8rem 1.2rem;border-radius:.8rem;border:2px solid #1A141055;background:#fff;color:var(--ink);user-select:text}
  .pw input:focus{border-color:var(--red);box-shadow:0 0 0 .25rem #5C0F1A44}
  .sheet .ok{color:#2E6B2E;font-size:1.6rem;min-height:2rem}

  /* ---------- updates ---------- */
  .upd{position:fixed;inset-inline:0;bottom:2.2rem;margin:auto;width:max-content;max-width:90vw;z-index:50;
       padding:.8rem 1.8rem;border-radius:999rem;background:var(--parchment);color:var(--ink);font-size:1.5rem;
       box-shadow:0 .6rem 2rem #0006;border:2px solid var(--gold)}
  .about{margin-top:1.6rem;font-size:1.25rem;opacity:.8;display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap}
  .about .btn{font-size:1.25rem;padding:.4rem 1.1rem}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  #apPin b{display:inline-block;font:600 1.8em/1 var(--serif);letter-spacing:.12em;margin-inline-start:.3em;vertical-align:middle}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cross" viewBox="0 0 100 100">
    <g fill="currentColor">
      <rect x="44" y="14" width="12" height="72" rx="2"/><rect x="14" y="44" width="72" height="12" rx="2"/>
      <circle cx="50" cy="9" r="5.5"/><circle cx="42.5" cy="14" r="5.5"/><circle cx="57.5" cy="14" r="5.5"/>
      <circle cx="50" cy="91" r="5.5"/><circle cx="42.5" cy="86" r="5.5"/><circle cx="57.5" cy="86" r="5.5"/>
      <circle cx="9" cy="50" r="5.5"/><circle cx="14" cy="42.5" r="5.5"/><circle cx="14" cy="57.5" r="5.5"/>
      <circle cx="91" cy="50" r="5.5"/><circle cx="86" cy="42.5" r="5.5"/><circle cx="86" cy="57.5" r="5.5"/>
    </g>
    <circle cx="50" cy="50" r="16" fill="none" stroke="currentColor" stroke-width="4"/>
  </symbol>
</svg>
<template id="crossTpl"><svg class="mark"><use href="#cross"/></svg></template>

<!-- ======================= HOME ======================= -->
<div id="home">
  <header>
    <img class="mark" src="img/st-peter-logo.png" alt="" onerror="this.replaceWith(crossTpl.content.cloneNode(true))">
    <div>
      <div class="church" id="church"></div>
      <div class="today" id="today"></div>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <nav class="tiles" id="tiles"></nav>

  <footer>
    <button class="pill wifi" id="wifiBtn"></button>
    <button class="pill" id="langBtn"></button>
  </footer>
</div>

<!-- ======================= LANGUAGE ======================= -->
<div class="stage" id="picker">
  <img class="mark" src="img/st-peter-logo.png" alt="" onerror="this.replaceWith(crossTpl.content.cloneNode(true))">
  <div class="pickhead">Choose your language<span>اختار اللغة</span></div>
  <div class="choices">
    <button class="choice" data-lang="en">English</button>
    <button class="choice arb" data-lang="ar">العربية</button>
  </div>
  <div class="clock clockMirror"></div>
</div>

<!-- ======================= POP-UPS ======================= -->
<div class="overlay" id="ovAirplay"><div class="sheet">
  <h2 data-t="apTitle"></h2>
  <ol><li data-t="apStep1"></li><li data-t="apStep2"></li><li><span data-t="apStep3"></span> <span class="name tvname"></span></li></ol>
  <p class="small" id="apPin"></p>
  <div class="row"><button class="btn" data-close data-t="ok"></button></div>
</div></div>

<div class="overlay" id="ovReader"><div class="sheet">
  <h2 data-t="crTitle"></h2>
  <p data-t="crLead"></p>
  <div class="row"><button class="btn" id="crWin" data-t="crWin"></button><button class="btn ghost" data-close data-t="back"></button></div>
</div></div>

<div class="overlay" id="ovWindows"><div class="sheet">
  <h2 id="winTitle"></h2>
  <p id="winLead"></p>
  <div class="media" id="winMedia" hidden></div>
  <div class="wait" id="winWait" hidden></div>
  <div class="progress" id="winBar" hidden><i id="winBarFill"></i></div>
  <p class="warn" id="winMsg" role="alert"></p>
  <div class="row"><button class="btn" id="winGo"></button><button class="btn ghost" id="winCancel"></button></div>
  <p class="small" id="winBack"></p>
</div></div>

<div class="overlay" id="ovWifi"><div class="sheet">
  <h2 data-t="wfTitle"></h2>
  <div id="wfPick">
    <p id="wfState"></p>
    <div class="nets" id="wfList"></div>
    <div class="row"><button class="btn" id="wfScan" data-t="wfScan"></button><button class="btn ghost" data-close data-t="back"></button></div>
  </div>
  <div id="wfPass" hidden>
    <p id="wfPassLead"></p>
    <div class="pw"><input id="wfPw" type="password" autocomplete="off" spellcheck="false"><button class="btn ghost" id="wfShow" data-t="wfShow"></button></div>
    <div class="row"><button class="btn" id="wfGo" data-t="wfConnect"></button><button class="btn ghost" id="wfBack" data-t="back"></button></div>
  </div>
  <p class="warn" id="wfMsg" role="alert"></p>
  <div class="about"><span id="upVer"></span><button class="btn ghost" id="upCheck" data-t="upCheck"></button><span id="upMsg"></span></div>
</div></div>

<div class="upd" id="updToast" hidden role="status"></div>

    }
    if (!k.startsWith('Arrow')) return;
    if (document.activeElement.tagName === 'INPUT' && (k === 'ArrowLeft' || k === 'ArrowRight')) return;
    e.preventDefault(); move(k);
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ------------------------------------------------------------------ start
  render();
  setInterval(tick, 10000);
  // (the TV box opens this page with #start only on its first launch after power-on)
  if (C.askLanguageAtStartup !== false && location.hash === '#start') { history.replaceState(null, '', location.pathname); showStart(); }
  else showHome();
})();
</script>
</body>
</html>
